{% extends "base.html" %}
{% block content %}
<h2>Redactar Nuevo Aviso</h2>
<form method="POST" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Título del Aviso</label>
        <input type="text" name="titulo" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Contenido</label>
        <textarea name="contenido" class="form-control" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-success">Publicar y Enviar WhatsApp</button>
</form>
{% endblock %}
