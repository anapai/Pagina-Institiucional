{% extends "base.html" %}
{% block content %}
<h2>Registro Diario de Asistencia</h2>
<form method="POST" class="mt-3">
    <div class="mb-3 col-md-4">
        <label class="form-label">Fecha</label>
        <input type="date" name="fecha" class="form-control" required>
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Alumno</th>
                <th>Grado y Grupo</th>
                <th>¿Presente? (Desmarcar si falta)</th>
            </tr>
        </thead>
        <tbody>
            {% for alumno in alumnos %}
            <tr>
                <td>{{ alumno.nombre }}</td>
                <td>{{ alumno.grado_grupo }}</td>
                <td>
                    <input type="checkbox" name="alumno_{{ alumno.id }}" checked class="form-check-input">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button type="submit" class="btn btn-primary">Guardar Asistencia y Notificar Inasistencias</button>
</form>
{% endblock %}
