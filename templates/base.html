<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Instituto Lomas de León - Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Lomas de León</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">Avisos</a>
                <a class="nav-link" href="{{ url_for('calendario') }}">Calendario</a>
                <a class="nav-link" href="{{ url_for('registro_asistencia') }}">Asistencia</a>
                <a class="nav-link" href="{{ url_for('nuevo_aviso') }}">Publicar Aviso</a>
                <a class="nav-link" href="{{ url_for('manual') }}">Manual de Uso</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
